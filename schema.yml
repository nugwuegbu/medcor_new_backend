openapi: 3.0.3
info:
  title: MedCor Healthcare Platform API
  version: 1.0.0
  description: Comprehensive healthcare platform with AI analysis capabilities
paths:
  /api/appointments/appointments/:
    get:
      operationId: appointments_appointments_list
      description: ViewSet for managing appointments.
      parameters:
      - in: query
        name: appointment_type
        schema:
          type: string
          enum:
          - CONSULTATION
          - EMERGENCY
          - FOLLOW_UP
          - LAB_TEST
          - ROUTINE_CHECKUP
          - SURGERY
          - TELEMEDICINE
          - THERAPY
          - VACCINATION
        description: |-
          * `CONSULTATION` - Consultation
          * `FOLLOW_UP` - Follow-up
          * `ROUTINE_CHECKUP` - Routine Checkup
          * `EMERGENCY` - Emergency
          * `TELEMEDICINE` - Telemedicine
          * `VACCINATION` - Vaccination
          * `LAB_TEST` - Lab Test
          * `SURGERY` - Surgery
          * `THERAPY` - Therapy
      - in: query
        name: doctor
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
          format: uuid
      - in: query
        name: scheduled_date
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - IN_PROGRESS
          - NO_SHOW
          - RESCHEDULED
          - SCHEDULED
        description: |-
          * `SCHEDULED` - Scheduled
          * `IN_PROGRESS` - In Progress
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
          * `NO_SHOW` - No Show
          * `RESCHEDULED` - Rescheduled
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: appointments_appointments_create
      description: Create appointment with hospital from user.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreate'
          description: ''
