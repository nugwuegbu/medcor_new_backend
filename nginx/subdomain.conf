# Nginx configuration for subdomain-based multi-tenancy
# This file should be included in your main nginx configuration

# Upstream for Django application
upstream django_app {
    server 127.0.0.1:8000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name medcor.ai www.medcor.ai;
    return 301 https://medcor.ai$request_uri;
}

# Main domain (medcor.ai) - HTTPS
server {
    listen 443 ssl http2;
    server_name medcor.ai www.medcor.ai;

    # SSL configuration (Let's Encrypt certificates)
    # Try these paths in order - use the one that exists on your server:
    # Option 1: Standard Let's Encrypt paths
    ssl_certificate /etc/letsencrypt/live/medcor.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medcor.ai/privkey.pem;
    # Option 2: If using .crt/.key format, uncomment these instead:
    # ssl_certificate /etc/letsencrypt/live/medcor.ai/cert.pem;
    # ssl_certificate_key /etc/letsencrypt/live/medcor.ai/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/medcor.ai/chain.pem;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect www to non-www
    if ($host = www.medcor.ai) {
        return 301 https://medcor.ai$request_uri;
    }

    # Main site location
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Static files
    location /static/ {
        alias /var/www/html/medcor_backend2/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /var/www/html/medcor_backend2/media/;
        expires 1y;
        add_header Cache-Control "public";
    }
}

# HTTP to HTTPS redirect for wildcard subdomains
server {
    listen 80;
    server_name *.medcor.ai;
    return 301 https://$host$request_uri;
}

# Wildcard subdomain for hospitals - HTTPS
server {
    listen 443 ssl http2;
    server_name *.medcor.ai;

    # SSL configuration (Let's Encrypt certificates - same as main domain)
    # Use the same certificate paths as the main domain above
    ssl_certificate /etc/letsencrypt/live/medcor.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medcor.ai/privkey.pem;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Extract subdomain and pass to Django
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        
        # Pass subdomain information
        proxy_set_header X-Subdomain $subdomain;
    }

    # Static files
    location /static/ {
        alias /var/www/html/medcor_backend2/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /var/www/html/medcor_backend2/media/;
        expires 1y;
        add_header Cache-Control "public";
    }
}

# Development/testing server (localhost)
server {
    listen 80;
    server_name localhost *.localhost;

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Static files
    location /static/ {
        alias /var/www/html/medcor_backend2/staticfiles/;
    }

    # Media files
    location /media/ {
        alias /var/www/html/medcor_backend2/media/;
    }
}